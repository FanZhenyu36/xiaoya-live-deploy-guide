# Optional legacy route only. Not used by the Vidu live workstation.
services:
  duix-avatar-gen-video:
    image: guiji2025/duix.avatar-5090@sha256:a1254c4057ff5dee26793f6e0845e1130718f7c56ea3a7423fbe49e20e7c602f
    container_name: duix-avatar-gen-video
    restart: unless-stopped
    volumes:
      - "${DUIX_DATA_DIR:-D:/duix_avatar_data/face2face}:/code/data"
    environment:
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:512
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: "8g"
    ports:
      - "127.0.0.1:9000:8383"
    command: python /code/app_local.py
